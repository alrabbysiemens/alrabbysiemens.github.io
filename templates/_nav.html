<nav class="topnav wrap" aria-label="Main">
  <a class="brand" href="{{ url('') }}">
    {% include "_brand.html" %}
    <span>{{ p.name }}</span>
  </a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <ul class="menu" id="menu">
    {% for item in nav %}
      {% if item.children %}
      <li class="has-sub{% if section == item.key %} active{% endif %}">
        <button type="button" class="sub-btn" aria-expanded="false">{{ item.label }}<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <ul class="sub">
          {% for c in item.children %}<li><a href="{{ url(c.href) }}"{% if path == c.href %} aria-current="page"{% endif %}>{% if c.label == "SIEM Lab" %}<span class="siem-word"><b>SIEM</b> <i>Lab</i></span>{% else %}{{ c.label }}{% endif %}</a></li>{% endfor %}
        </ul>
      </li>
      {% else %}
      <li{% if section == item.key %} class="active"{% endif %}><a href="{{ url(item.href) }}"{% if path == item.href %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
