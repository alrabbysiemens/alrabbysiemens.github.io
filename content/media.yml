# Gallery: upload photos to static/img/gallery/ and list them here.
gallery:
  - title: Farewell, Batch 261
    when: "2026"
    place: BUFT, Dhaka
    images: [img/gallery/buft-farewell-1.jpg, img/gallery/buft-farewell-2.jpg]
    text: |
      Another wonderful semester has come to an end at BUFT as an Adjunct Faculty. It was a pleasure teaching Bangladesh Studies to such kind, respectful and enthusiastic students.

      Thank you, Batch 261_1 & 261_4, for all the memories and love. I will truly miss our classes. Wishing you all the very best for a bright and successful future. Keep learning and keep shining! ❤️
  - title: Lessons Among the Leaves
    place: BUFT, Dhaka
    images: [img/gallery/buft-leaves.jpg]
    text: |
      I love teaching at BUFT as an Adjunct Faculty! Guiding students in Environmental Ecology and lab work is fun and inspiring. I enjoy seeing their curiosity, questions, and lightbulb moments as they connect what we learn in class to real-life environmental challenges. Every class keeps me excited and learning too!
  - title: Project BRAVE, Ukhiya
    when: "2025"
    place: Ukhiya, Cox's Bazar
    images: [img/gallery/brave-1.jpg, img/gallery/brave-5.jpg, img/gallery/brave-3.jpg, img/gallery/brave-4.jpg, img/gallery/brave-2.jpg]
    text: |
      I had the opportunity to serve as a guest speaker at Abul Kashem Noor Jahan Chowdhury High School, Ukhiya, Cox's Bazar - a region highly prone to natural disasters such as cyclones, floods, and landslides.

      Thanks to the kind invitation of Teach For Bangladesh Fellow SM Rashedul Islam, I conducted a session on "Preparedness Amid Adversity" (প্রতিকূলতার মধ্যে সুরক্ষা প্রস্তুতি) under the project BRAVE (Building Resilience Against Vulnerabilities and Emergencies), focusing on building awareness and capacity for disaster risk reduction. The enthusiastic students actively participated and learned about:

      - ⚠️ Introduction to Hazard, Disaster, Vulnerability, and Risk
      - 🔄 The Disaster Management Cycle
      - 🗓️ Hazard Calendar Development
      - 🗺️ Community Mapping and Designing Evacuation Routes

      It was truly inspiring to see young learners so engaged in understanding how to protect their communities through planning, knowledge, and teamwork. Empowering youth with disaster awareness today means building a resilient tomorrow.

      It was also heartening to see that the students are well-informed about e-learning and digital education, especially 10 Minute School. It proves how deeply 10 Minute School has reached even the most remote corners of the country.
  - title: 29 NST Fellows from Batch 47
    when: "2024"
    place: Dept. of Geography and Environment, JU
    images: [img/gallery/nst-47-batch.jpg]
    text: |
      From the 47th batch of the Department of Geography and Environment, Jahangirnagar University, an impressive 29 students (including myself) have been awarded the National Science and Technology (NST) Fellowship! And let's not forget - many of our batchmates didn't apply as they have chosen different paths, such as pursuing higher studies abroad, securing jobs in the government and private sectors, or preparing for BCS written and other competitive exams.
  - title: Bay of Bengal Conversation 2024
    when: "2024"
    place: Dhaka
    images: [img/gallery/bay-of-bengal-2024.jpg]
    text: |
      The ceremony began with a speech by Chief Advisor Dr. Muhammad Yunus, followed by Quiroga Ramirez (Former President of Bolivia), Mahathir Mohamad (Former Prime Minister of Malaysia), and concluded with Boris Tadic (Former President of Serbia). It was an amazing experience engaging with world-renowned professors, policymakers, scientists, ambassadors, and high commissioners. I also had the chance to interact with researchers and share my perspectives.
  - title: Brothers in Excellence
    place: 10 Minute School, Dhaka
    images: [img/gallery/10ms-award.jpg]
    text: |
      On this memorable day, my brother Arafat Samir Abir and I were honored by 10 Minute School for our contributions to academic content creation. Through dedication and teamwork, we played a key role in crafting educational resources that impacted countless students. I was awarded the Speed Master title, while Arafat received the Mr. Perfectionist Award.
  - title: First Debate Win
    when: "2019"
    place: Rotaract Debate Competition, Dhaka
    images: [img/gallery/debate-2019.jpg]
    text: |
      One of the memorable milestones in my journey was winning my very first debate championship at the Rotaract Debate Competition 2019, alongside my friend Prapti Taposhi and our senior Rokeya Asha. This achievement was not just about winning but about learning the importance of teamwork, effective communication, and the value of constructive arguments.
