  note_label: Thesis
  note: Modeling for the Impact Assessment of Shrimp Farming Practices on the Ecosystem of Northern Bay of Bengal in Bangladesh
  supervisor: Professor Dr. Md. Nazrul Islam, Department of Geography & Environment, Jahangirnagar University
  glimpse:
    - Compared controlled (Barguna) and non-controlled (Bagerhat) shrimp aquaculture zones and their adjacent continental shelf in the northern Bay of Bengal.
    - Combined field sampling, bathymetry and geostatistical (IDW) mapping of pollutants and nutrients with statistical testing.
    - Built an 11-group Ecopath with Ecosim trophic model to trace impacts of toxic metals and harmful algal blooms on the food web.
    - Proposed policy options (UNCLOS, ECR 1997, IMTA and BMP) for sustainable shrimp farming.
