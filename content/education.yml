  note_label: Report
  note: Modeling on the Influencing Factors for Changing Trends of Belai Beel Wetland at Gazipur District in Bangladesh
  supervisor: Professor Dr. Md. Nazrul Islam, Department of Geography & Environment, Jahangirnagar University
  glimpse:
    - Assessed a 9,217-hectare freshwater wetland across four upazilas of Gazipur District.
    - Documented its species diversity and decline, alongside changing water extent (2015-2022) and livelihoods.
    - Traced cause-and-effect links between drivers such as population growth, industry and agricultural runoff.
    - Proposed a four-phase mitigation strategic model to guide wetland management.
