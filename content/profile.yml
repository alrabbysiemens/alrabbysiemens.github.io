# Short bio shown on the About page
bio: >-
  I am a geographer trained at Jahangirnagar University (B.Sc. and M.Sc. in Geography
  and Environment), now teaching at BGMEA University of Fashion & Technology. My research
  uses GIS, remote sensing, field surveys and modelling to understand how Bangladesh's
  wetlands, coasts, forests and cities are changing, and how communities and policy can
  respond.

research_interests:
  - Environmental modelling
  - Ecosystem services
  - Wetland management
  - Coastal management
  - Climate change
  - Urban land use
  - Sustainable development
  - GIS & remote sensing
  - Geo-ML
  - Field survey

