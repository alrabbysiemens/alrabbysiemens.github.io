leadership:
  - org: Geography Debating Club, Jahangirnagar University
    logo: img/logos/geo-debating-club.png
    role: Secretary General · Organizing Secretary
    years: 2019–2022
    points:
      - Built a space where geography students could argue about the world they study, not just describe it.
      - Believed that a good question about land, water or people is the start of good research.
      - Learned that organising others is its own lesson in listening and responsibility.
  - org: Jahangirnagar University Debate Organization (JUDO)
    logo: img/logos/judo.png
    role: Associate Organizing Secretary · Education and Research Secretary
    years: 2019–2021
    points:
      - Debate taught me to understand the other side before answering it.
      - Training younger debaters was a way of passing on the confidence others gave me.
      - Reason and respectful disagreement are what keep a campus, and a country, healthy.
  - org: BADHAN (voluntary blood donation)
    logo: img/logos/badhan.png
    role: Volunteer blood donor
    years: 2018–present
    points:
      - Giving blood is the simplest way I know to help a stranger I will never meet.
      - It reminds me that community is built in small, quiet acts.

